apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: TimescaleDB
    type: postgres
    url: timescaledb:5432
    user: postgres
    secureJsonData:
      password: witsml_secure_pw
    jsonData:
      database: witsml_telemetry
      sslmode: disable
      postgresVersion: 1500
      timescaledb: true
    editable: true

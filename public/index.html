<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rig-412 Edge AI Dashboard</title>
    <style>
        body { background: #0f172a; color: #38bdf8; font-family: monospace; padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .panel { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 8px; }
        input { background: #0f172a; color: #10b981; border: 1px solid #475569; padding: 8px; width: 100%; margin-bottom: 15px; }
        button { background: #0284c7; color: white; border: none; padding: 10px 15px; cursor: pointer; font-weight: bold; width: 100%; border-radius: 4px; }
        button:hover { background: #0369a1; }
        #live-feed { height: 400px; overflow-y: auto; background: #000; padding: 15px; border-radius: 4px; border: 1px solid #334155; }
        .log-normal { color: #10b981; margin-bottom: 8px; }
        .log-ilt { color: #ef4444; font-weight: bold; margin-bottom: 8px; }
    </style>
</head>
<body>
    <h2>WITSML Edge AI | Rig-412</h2>
    <div class="grid">
        <div class="panel">
            <h3>SOP Firewall Settings</h3>
            <label>Minimum WOB (klbs):</label>
            <input type="number" id="wob">
            <label>Minimum RPM:</label>
            <input type="number" id="rpm">
            <label>Minimum Flow (gpm):</label>
            <input type="number" id="flow">
            <label>Max Connection Time (s):</label>
            <input type="number" id="conn">
            <button onclick="saveSOP()">Deploy SOPs to Edge Model</button>
        </div>
        <div class="panel">
            <h3>Live Qwen 3B Telemetry Stream</h3>
            <div id="live-feed">Waiting for WITSML telemetry...</div>
        </div>
    </div>

    <script>
        // Load existing SOPs on page load
        fetch('/api/sops').then(res => res.json()).then(data => {
            document.getElementById('wob').value = data.min_wob;
            document.getElementById('rpm').value = data.min_rpm;
            document.getElementById('flow').value = data.min_flow;
            document.getElementById('conn').value = data.max_conn_time;
        });

        // Save new SOPs and update backend
        function saveSOP() {
            fetch('/api/sops', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    min_wob: Number(document.getElementById('wob').value),
                    min_rpm: Number(document.getElementById('rpm').value),
                    min_flow: Number(document.getElementById('flow').value),
                    max_conn_time: Number(document.getElementById('conn').value)
                })
            }).then(() => alert('SOPs successfully deployed to Edge AI memory!'));
        }

        // Connect to Server-Sent Events (SSE) for the live log stream
        const source = new EventSource('/api/stream');
        source.onmessage = function(event) {
            const data = JSON.parse(event.data);
            const feed = document.getElementById('live-feed');
            const time = new Date().toLocaleTimeString();
            const cssClass = data.is_ilt ? 'log-ilt' : 'log-normal';
            const status = data.is_ilt ? 'ILT DETECTED' : 'NORMAL';
            
            feed.innerHTML += `<div class="${cssClass}">[${time}] [${status}] ${data.justification}</div>`;
            feed.scrollTop = feed.scrollHeight; 
        };
    </script>
</body>
</html>

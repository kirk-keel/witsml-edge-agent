version: '3.8'

services:
  witsml-agent:
    build: .
    container_name: witsml-agent
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - OLLAMA_HOST=http://host.docker.internal:11434
      - DB_HOST=timescaledb
      - DB_USER=postgres
      - DB_PASSWORD=witsml_secure_pw
      - DB_NAME=witsml_telemetry
    volumes:
      - ./logs:/usr/src/app/logs
    depends_on:
      - timescaledb
    extra_hosts:
      - "host.docker.internal:host-gateway"

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=witsml_secure_pw
      - POSTGRES_DB=witsml_telemetry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=witsml_admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - timescaledb

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
